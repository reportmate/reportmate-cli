name: release

# Build cross-platform binaries on version tags and attach them to the release.
#
# Assets, one tarball each containing a single `reportmate` (or
# `reportmate.exe`) binary:
#   reportmate-aarch64-apple-darwin.tar.gz      Apple silicon
#   reportmate-x86_64-apple-darwin.tar.gz       Intel Mac
#   reportmate-universal-apple-darwin.tar.gz    both, lipo-merged
#   ReportMateCLI-<version>.pkg                 unsigned installer of the universal
#                                               binary to /usr/local/bin, for fleet
#                                               management pipelines to sign and ship
#   reportmate-x86_64-unknown-linux-gnu.tar.gz
#   reportmate-x86_64-pc-windows-msvc.tar.gz
#   reportmate-aarch64-pc-windows-msvc.tar.gz
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: RM_VERSION=${GITHUB_REF_NAME#v} cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          bin=reportmate
          [ "${{ matrix.os }}" = "windows-latest" ] && bin=reportmate.exe
          tar -czf "reportmate-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "$bin"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: reportmate-${{ matrix.target }}.tar.gz

  # macOS builds both architectures on one runner so the universal binary can
  # be lipo-merged without shuttling artifacts between jobs.
  build-macos:
    name: build (macOS arm64, x86_64, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build
        run: |
          export RM_VERSION=${GITHUB_REF_NAME#v}
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/reportmate \
            target/x86_64-apple-darwin/release/reportmate \
            -output target/universal-apple-darwin/release/reportmate
          lipo -info target/universal-apple-darwin/release/reportmate
          for t in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            tar -czf "reportmate-$t.tar.gz" -C "target/$t/release" reportmate
          done

      # An unsigned installer package for fleet deployment: a management
      # pipeline downloads it, signs and notarizes it with its own identity,
      # and imports it. Installs the universal binary at /usr/local/bin.
      - name: Build installer package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "$ver" | grep -Eq '^[0-9]+(\.[0-9]+)+$' || ver=0.0.0
          root=$(mktemp -d)
          mkdir -p "$root/usr/local/bin"
          install -m 755 target/universal-apple-darwin/release/reportmate "$root/usr/local/bin/reportmate"
          pkgbuild --root "$root" --identifier io.reportmate.cli --version "$ver" \
            --install-location / "ReportMateCLI-$ver.pkg"
          rm -rf "$root"
          ls -l ReportMateCLI-*.pkg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            reportmate-aarch64-apple-darwin.tar.gz
            reportmate-x86_64-apple-darwin.tar.gz
            reportmate-universal-apple-darwin.tar.gz
            ReportMateCLI-*.pkg
