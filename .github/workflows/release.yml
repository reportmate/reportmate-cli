name: release

# Build cross-platform binaries on version tags and attach them to the release.
#
# Assets, one tarball each containing a single `reportmateutil` (or
# `reportmateutil.exe`) binary:
#   reportmateutil-aarch64-apple-darwin.tar.gz      Apple silicon
#   reportmateutil-x86_64-apple-darwin.tar.gz       Intel Mac
#   reportmateutil-universal-apple-darwin.tar.gz    both, lipo-merged
#   ReportMateUtil-<version>.pkg                 unsigned installer of the universal
#                                               binary to /usr/local/bin, for fleet
#                                               management pipelines to sign and ship
#   reportmateutil-x86_64-unknown-linux-gnu.tar.gz
#   reportmateutil-x86_64-pc-windows-msvc.tar.gz
#   reportmateutil-aarch64-pc-windows-msvc.tar.gz
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: RM_VERSION=${GITHUB_REF_NAME#v} cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          bin=reportmateutil
          [ "${{ matrix.os }}" = "windows-latest" ] && bin=reportmateutil.exe
          tar -czf "reportmateutil-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "$bin"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: reportmateutil-${{ matrix.target }}.tar.gz

  # macOS builds both architectures on one runner so the universal binary can
  # be lipo-merged without shuttling artifacts between jobs.
  build-macos:
    name: build (macOS arm64, x86_64, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build
        run: |
          export RM_VERSION=${GITHUB_REF_NAME#v}
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/reportmateutil \
            target/x86_64-apple-darwin/release/reportmateutil \
            -output target/universal-apple-darwin/release/reportmateutil
          lipo -info target/universal-apple-darwin/release/reportmateutil
          for t in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            tar -czf "reportmateutil-$t.tar.gz" -C "target/$t/release" reportmateutil
          done

      # An unsigned installer package for fleet deployment: a management
      # pipeline downloads it, signs and notarizes it with its own identity,
      # and imports it. Installs the universal binary at /usr/local/bin.
      - name: Build installer package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "$ver" | grep -Eq '^[0-9]+(\.[0-9]+)+$' || ver=0.0.0
          root=$(mktemp -d)
          mkdir -p "$root/usr/local/bin"
          install -m 755 target/universal-apple-darwin/release/reportmateutil "$root/usr/local/bin/reportmateutil"
          pkgbuild --root "$root" --identifier io.reportmate.util --version "$ver" \
            --install-location / "ReportMateUtil-$ver.pkg"
          rm -rf "$root"
          ls -l ReportMateUtil-*.pkg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            reportmateutil-aarch64-apple-darwin.tar.gz
            reportmateutil-x86_64-apple-darwin.tar.gz
            reportmateutil-universal-apple-darwin.tar.gz
            ReportMateUtil-*.pkg
